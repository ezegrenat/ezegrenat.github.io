<!-- Footer -->
<footer class="footer">
  <div class="container">
    <div class="footer-inner">

      <span class="footer-brand">Ezequiel Grenat</span>

      <ul class="footer-links">
        {% if site.email %}
        <li>
          <a href="mailto:{{ site.email | encode_email }}" title="Email" aria-label="Email">
            <i class="far fa-envelope"></i>
          </a>
        </li>
        {% endif %}
        <li>
          <a href="https://github.com/ezegrenat" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/ezequiel-grenat-b28b99142/" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
        </li>
        {% if site.twitter_username %}
        <li>
          <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener" title="Twitter" aria-label="Twitter">
            <i class="fab fa-twitter"></i>
          </a>
        </li>
        {% endif %}
      </ul>

    </div>

    <p class="footer-copy">
      &copy; {{ 'now' | date: "%Y" }} Ezequiel Grenat &mdash; Data Scientist · Buenos Aires, Argentina
    </p>
  </div>
</footer>
