---
layout: default
---

<!-- Page Header -->
<header class="page-header">
  {% if page.background %}
  <div style="position:absolute;inset:0;background-image:url('{{ page.background | prepend: site.baseurl | replace: '//', '/' }}');background-size:cover;background-position:center;opacity:0.10;"></div>
  {% endif %}
  <div class="container-narrow page-header-inner">
    <span class="page-header-label">{{ page.title }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="page-header-subtitle">{{ page.description }}</p>
    {% endif %}
  </div>
</header>

<!-- Page Content -->
<div class="post-content">
  <div class="container-narrow">
    {{ content }}
  </div>
</div>
